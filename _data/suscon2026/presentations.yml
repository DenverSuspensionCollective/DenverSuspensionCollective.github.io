section_description: "There will be two classes or presentations each day, hosted by our volunteer speakers."
include_tba_card: true
presenters:
  - name: Bridget Hall
    id: bridgethall
    image: bridget_hall.jpg
    presentation_title: Aseptic Technique for the Suspension Practitioner
    presentation_description: >
      A comprehensive look at aseptic technique for all roles within a body suspension. This class will discuss what aseptic technique is, how it protects practitioners and suspendees, and the recommended procedures for maintaining hygiene and preventing blood borne infections from start to finish.
    bio: >
      Bridget Hall is a professional body piercer and suspension practitioner from Indiana, currently based in Ohio. She has been piercing for over 5 years and has been involved in the suspension community since 2022. Bridget has participated in educational piercing and/or suspension events in four countries. She has a passion for keeping education and knowledge accessible and available within the body modification community.
  - name: Lisa B. and Julia Church
    id: lisaandjulia
    image: lisa_and_julia.jpg
    presentation_title: "Skin, Psyche, and the Sacred Pull"
    presentation_description: >
      Skin, Psyche, and the Sacred Pull is a deep dive into the psychological, somatic, and neurobiological layers of hook suspension, exploring how vulnerability, community, and the nervous system come together to create profound transformation. Attendees will learn how psychological concepts appear in suspension spaces, why co-regulation is essential for safety and connection, and how the brain’s own mechanisms and shape the emotional and physical experience of going up. This class blends science with soul and offers a rich, grounded framework for understanding how suspension changes us from the inside out.
    bio: >
      Lisa B. began her suspension journey in 2012 and started facilitating in 2013. Over the years, she has developed strong connections within the international suspension community and has been a consistent advocate for accessibility, safety, and inclusivity. Her contributions have supported the growth of a more informed and welcoming environment for both new and experienced participants. She currently serves as an advisor for State of Bliss, where she provides practical guidance on media, styling, and people management. Lisa approaches her work with clarity, honesty, and a focus on collaboration, helping support both the creative and operational needs of the team. She remains actively involved in efforts to nurture and sustain the suspension community in the UK.
      <br><br>
      Julia Church comes from a colorful background in biochemistry and spent several years working in environmental, pharmaceutical, and genetic research industries. She ultimately ended up in natural medicine and quality control after realizing she was unwilling to sell her soul to a pharmaceutical company. Her first experience with suspension was facilitated by Lisa in 2015, prior to a marathon of surgeries that took six years to complete. A decade later, she has returned to suspension in search of community, exploration, and communion with the divine self. Above all else, she is passionate about the things that science cannot explain.
  - name: Surprise International Guest Speaker
    id: hooklinerigging101
    presentation_title: Hookline Rigging 101
    presentation_description: >
      Hookline Rigging 101 introduces the fundamental principles and techniques of below the plate rigging for hook suspension. This class covers minimum breaking strength (MBS), working load limits (WLL), and how to appropriately derate cord for knots based on the material being used. We'll explore common knots, basic rigging techniques, and how to account for changing angles and loads within a suspension system. Primarily lecture and demonstration, this class focuses on understanding a small set of foundational principles that can be applied and expanded to confidently rig everything from basic suspensions to more complex configurations.
    bio: >
      We're keeping this one under wraps for now &mdash; check back closer to Suscon 2026 for the reveal!
  - name: Surprise International Guest Speakers
    id: buildingcommunityaroundsuspension
    presentation_title: Building Community Around Suspension
    presentation_description: >
      Building Community Around Suspension is a round-table discussion about what it takes to build a suspension community when you're starting with little or nothing around you. We'll talk about the practical challenges of finding a venue, presenting suspension professionally to businesses that may be unfamiliar with or uncomfortable with the practice, creating healthy and sustainable organizing structures, and making participation accessible to people with different resources and experience levels. We'll explore how regular, consistent gatherings can help a community develop over time, and how to create an environment where newcomers feel welcomed rather than like outsiders. Most importantly, we'll share lessons from people who have done this themselves, including how to build a strong local community while remaining connected to the international suspension community for knowledge, training, and support.
    bio: >
      We're keeping this one under wraps for now &mdash; check back closer to Suscon 2026 for the reveal!
